name: Refresh profile

# Rebuilds the terminal, the trace, the open-source table and the changelog
# from the GitHub API and salman-ch.netlify.app. Commits only when something changed.
on:
  schedule:
    - cron: '30 3 * * *' # daily, 08:30 PKT
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['data/**', 'scripts/**']

permissions:
  contents: write

concurrency:
  group: profile-refresh
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/build.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit if changed
        run: |
          [ -z "$(git status --porcelain)" ] && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: refresh profile"
          git push
